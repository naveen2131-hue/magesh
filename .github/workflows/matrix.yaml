name: Matrix Helm Chart

on:
  workflow_dispatch:
    inputs:
      repo_names:
        description: 'Comma-separated repo names (e.g. repo1,repo2)'
        required: true
        type: string
      release_branches:
        description: 'Comma-separated release branches (e.g. uat,uat)'
        required: true
        type: string
      pr_branches:
        description: 'Comma-separated PR branches (e.g. feature-branch-1,feature-branch-2)'
        required: true
        type: string
      product_names:
        description: 'Comma-separated product names (e.g. productA,productB)'
        required: true
        type: string

jobs:
  Enable_Helm_Chart_Scan:
    runs-on: medium-runner
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Split and process each set
        env:
          REPO_NAMES: ${{ github.event.inputs.repo_names }}
          RELEASE_BRANCHES: ${{ github.event.inputs.release_branches }}
          PR_BRANCHES: ${{ github.event.inputs.pr_branches }}
          PRODUCT_NAMES: ${{ github.event.inputs.product_names }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          IFS=',' read -ra repos <<< "$REPO_NAMES"
          IFS=',' read -ra releases <<< "$RELEASE_BRANCHES"
          IFS=',' read -ra prs <<< "$PR_BRANCHES"
          IFS=',' read -ra products <<< "$PRODUCT_NAMES"
          for i in "${!repos[@]}"; do
            echo "Processing: repo=${repos[$i]}, release=${releases[$i]}, pr=${prs[$i]}, product=${products[$i]}"
            git clone --branch "${releases[$i]}" "https://github.com/m2pfintech/${repos[$i]}.git" "${repos[$i]}"
            cd "${repos[$i]}"
            git checkout -b "${prs[$i]}"
            mkdir -p .github/workflows
            echo '' >> .github/workflows/ci.yml
            cat ${GITHUB_WORKSPACE}/Helm-Chart >> .github/workflows/ci.yml
            sed -i '/secrets: inherit/a\    with:\n      product_name: ${products[$i]}' .github/workflows/ci.yml
            git config --global user.name "DevSecOps"
            git config --global user.email "devsecops@gmail.com"
            git add .github/workflows/ci.yml
            git commit -m "Helm Chart Scan"
            git push --set-upstream origin "${prs[$i]}"
            cd ..
          done
